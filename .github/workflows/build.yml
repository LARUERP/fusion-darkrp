name: Build Mod LabFusion
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Build Solution
      run: dotnet build Libs/DarkRPModule.csproj --configuration Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FusionDarkRP-DLL
        path: bin/Release/DarkRPModule.dll
